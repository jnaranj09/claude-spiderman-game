<!doctype html><html><head><meta charset="utf-8">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/gh/mrdoob/three.js@dev/build/three.webgpu.js","three/webgpu":"https://cdn.jsdelivr.net/gh/mrdoob/three.js@dev/build/three.webgpu.js","three/tsl":"https://cdn.jsdelivr.net/gh/mrdoob/three.js@dev/build/three.tsl.js","three/addons/":"https://cdn.jsdelivr.net/gh/mrdoob/three.js@dev/examples/jsm/"}}</script>
<style>body{margin:0;background:#000}</style></head><body>
<script type="module">
// Spider-Man model preview, through the game's own lighting presets, tone mapping & colour grade.
//   ?shot=front|back   the framing, pose & light direction of the two reference stills (overrides as JSON:
//                      &pitch= &yaw= &light= &cam= &look= &fov= &pose=)
//   ?v=front|back|side|3q|3qb&d=<distance>&face=1   standing turntable views
//   &t=<time preset>  &key=1 (no ground, magenta background: for masking him out)  &w= &h= (size)
import * as THREE from 'three/webgpu';
import { pass, vec4 } from 'three/tsl';
import { LightingSystem } from './js/lighting.js';
import { createPostProcessing } from './js/post-processing.js';
import { createSpiderManEntity, updateSpiderManVisuals } from './js/spiderman.js';
import { HERO_BODY, heroHelperPoses, heroPoseWeights } from './js/pedestrians.js';
// &body={"armpit":0.7,...}: try body settings without saving them
if (q0().get('body')) Object.assign(HERO_BODY, JSON.parse(q0().get('body')));
function q0() { return new URLSearchParams(location.search); }
const q = new URLSearchParams(location.search);
const shot = q.get('shot');
const SHOTS = {
  // The first still: crouched low, leaning in towards a camera above him, looking up into it; key light from his
  // left, above and a little in front
  front: {
    w: 1200, h: 676, fov: 32, light: [0.8, 0.6, -0.6],
    pelvis: [0, 0.5, -0.15], pitch: 0.75, yaw: 0,
    pose: {
      spine: [0.2, 0, 0], neck: [-1.25, 0, 0],
      shL: [-0.7, 0, 0.75], elL: [-0.9, 0, 0], shR: [-0.35, 0, -1.25], elR: [-0.25, 0, 0],
      hipL: [-2.1, 0, 0.45], knL: [2.3, 0, 0], ftL: [0.2, 0, 0], hipR: [-2.1, 0, -0.45], knR: [2.3, 0, 0], ftR: [0.2, 0, 0]
    },
    // camera & aim: [bone, offset] (bone 2 the head, 1 the chest), in the shot's frame
    cam: [2, [0.03, 0.45, 0.9]], look: [2, [0.0, -0.09, 0.0]]
  },
  // The second: from behind and to his left, crouched on a roof, his right arm thrown out ahead to the right, head
  // turned to his left; light from above, behind him and to his right
  back: {
    w: 800, h: 450, fov: 40, light: [-0.6, 0.8, 0.35],
    pelvis: [0, 0.5, 0], pitch: 0.5, yaw: -0.5,
    pose: {
      spine: [0.2, 0, 0], neck: [-0.2, 1.3, 0],
      shL: [-0.5, 0, 0.35], elL: [-1.2, 0, 0], shR: [-1.2, 0, -1.35], elR: [-0.15, 0, 0],
      hipL: [-1.8, 0, 0.35], knL: [2.4, 0, 0], ftL: [0.2, 0, 0], hipR: [-1.5, 0, -0.35], knR: [2.2, 0, 0], ftR: [0.2, 0, 0]
    },
    cam: [1, [0.62, 0.32, -1.0]], look: [1, [-0.15, 0.06, 0.1]]
  }
};
const S = shot ? SHOTS[shot] : null;
for (const k of ['pelvis', 'pitch', 'yaw', 'cam', 'look', 'light', 'fov', 'pose']) if (S && q.get(k)) S[k] = JSON.parse(q.get(k));
const W = +(q.get('w') || (S ? S.w : 600)), H = +(q.get('h') || (S ? S.h : 800));
const renderer = new THREE.WebGPURenderer({ antialias: true, forceWebGL: q.get('gl') !== '0' });
renderer.setPixelRatio(1);
renderer.setSize(W, H); renderer.shadowMap.enabled = true; document.body.appendChild(renderer.domElement); await renderer.init();
const scene = new THREE.Scene();
const lighting = new LightingSystem(scene, renderer);
const preset = q.get('t') || 'golden';
lighting.applyPreset(preset, true);
const key = q.get('key') === '1';
if (key) {
  scene.background = new THREE.Color(1, 0, 1);
  scene.traverse((o) => { if (o.isMesh) o.visible = false; }); // the sky dome
}
else {
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), new THREE.MeshStandardMaterial({ color: 0x4a6a9a, roughness: 0.9 }));
  ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
  const wall = new THREE.Mesh(new THREE.BoxGeometry(60, 30, 1), new THREE.MeshStandardMaterial({ color: 0x2c3e66, roughness: 0.9 }));
  wall.position.set(0, 15, 12); scene.add(wall);
}
const ent = createSpiderManEntity(scene);
if (q.get('plain')) scene.traverse((o) => { if (o.name === 'SpiderMan') o.material = new THREE.MeshStandardNodeMaterial({ color: 0x8f9bb8, roughness: 0.8 }); }); // &plain=1: plain cloth
if (q.get('noink')) scene.traverse((o) => { if (o.name === 'SpiderManOutline') o.visible = false; }); // &noink=1: no ink outline
ent.position.set(0, 0, 0); ent.heading = 0;
for (let i = 0; i < 120; i++) updateSpiderManVisuals(ent, 1 / 30, false);
const camera = new THREE.PerspectiveCamera(S ? S.fov : 35, W / H, 0.05, 500);

if (S) {
  // The whole set-up (him and the camera) turned about the vertical so the preset's sun comes from where the
  // still's light does (its height stays the preset's)
  const sun = lighting.sunLight.position.clone().normalize();
  const turn = Math.atan2(sun.x, sun.z) - Math.atan2(S.light[0], S.light[2]);
  const rig = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), turn);
  const at = (a) => new THREE.Vector3(...a).applyQuaternion(rig);
  // Pose him directly (forward kinematics, as the game does), bypassing the animation states
  const pose = {};
  for (const [name, [x, y, z]] of Object.entries(S.pose)) pose[name] = { x, y, z };
  const root = new THREE.Quaternion().setFromEuler(new THREE.Euler(S.pitch, S.yaw, 0, 'YXZ')).premultiply(rig);
  const m = ent.model;
  m.rig.poseFK(root, at(S.pelvis), pose, m.hands);
  const a = m.rig.pose, Q = new THREE.Quaternion(), T = new THREE.Vector3(), Sc = new THREE.Vector3();
  for (let b = 0; b < 15; b++) {
    const o = b * 8;
    Q.set(a[o], a[o + 1], a[o + 2], a[o + 3]); T.set(a[o + 4], a[o + 5], a[o + 6]); Sc.setScalar(a[o + 7]);
    m.bones[b].matrixWorld.compose(T, Q, Sc);
  }
  // Points on the posed body: the middle of the head (bone 2) or of the chest (bone 1) in the bind pose, carried by
  // its bone (whose matrix takes bind-pose points to the world), plus an offset in the shot's frame
  const CENTRES = { 1: [0, 1.3, 0], 2: [0, 1.63, 0] };
  const onBody = ([bone, off]) => new THREE.Vector3(...CENTRES[bone]).applyMatrix4(m.bones[bone].matrixWorld).add(at(off));
  const hp = heroHelperPoses(m.rig, [0, 1].map(() => ({ q: new THREE.Quaternion(), t: new THREE.Vector3(), s: 1 })));
  hp.forEach((h, k) => m.bones[15 + k].matrixWorld.compose(h.t, h.q, new THREE.Vector3().setScalar(h.s)));
  if (m.mesh.morphTargetInfluences) { heroPoseWeights(m.rig, m.mesh.morphTargetInfluences); m.mesh.morphTargetInfluences.forEach((v, i) => { m.outline.morphTargetInfluences[i] = v; }); }
  camera.position.copy(onBody(S.cam));
  camera.lookAt(onBody(S.look));
} else {
  const v = q.get('v') || 'front', d = +(q.get('d') || 3.6);
  const ang = { front: 0, back: Math.PI, side: Math.PI / 2, '3q': Math.PI / 5, '3qb': Math.PI * 0.8 }[v] ?? 0;
  const yc = +(q.get('y') || 1.0);
  camera.position.set(Math.sin(ang) * d, yc + 0.25, Math.cos(ang) * d);
  if (q.get('face')) { camera.position.set(Math.sin(ang) * 0.9, 1.65, Math.cos(ang) * 0.9); camera.lookAt(0, 1.6, 0); } else camera.lookAt(0, yc, 0);
}
camera.updateMatrixWorld();

// The game's pipeline: scene pass, then exposure, bloom, ACES & the preset's grade (no reflections here)
const scenePass = pass(scene, camera);
const grade = createPostProcessing(renderer, scenePass.getTextureNode('output'), vec4(0));
grade.applyPreset(preset);
const pipeline = new THREE.RenderPipeline(renderer, grade.outputNode);
pipeline.render(); pipeline.render();
await new Promise((r) => setTimeout(r, 300));
pipeline.render();
document.title = 'ready';
</script></body></html>
